<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/images/favicon.png" type="image/png" />
  <title>Snoopy's Magic Show</title>
  <meta name="google-site-verification" content="f-IZyEhpwN5qV3JabnOWGKJR-ed2_K2KxCrpGs5Jono" />
</head>
<body>
  <div class="wrapper" id="app">
    <div id="hud-stack" class="hud-stack">
      <div id="ui">
        <div id="score" class="ui-item">
          <span class="ui-icon">✦</span>
          <span class="ui-label">SCORE</span>
          <span class="ui-value" data-value="score">0</span>
        </div>
        <div id="high-score" class="ui-item">
          <span class="ui-icon">★</span>
          <span class="ui-label">BEST</span>
          <span class="ui-value" data-value="high-score">0</span>
        </div>
        <div id="lives" class="ui-item">
          <span class="ui-icon">♥</span>
          <span class="ui-label">LIVES</span>
          <span class="ui-value" data-value="lives">3</span>
        </div>
        <div id="level" class="ui-item">
          <span class="ui-icon">▶</span>
          <span class="ui-label">LEVEL</span>
          <span class="ui-value" data-value="level">1</span>
        </div>
      </div>
      <div
        id="custom-level-toolbar"
        class="custom-level-toolbar"
        aria-label="Import a custom level from JSON"
      >
        <span class="custom-level-toolbar__label">Custom level</span>
        <input
          type="file"
          id="custom-level-import"
          class="visually-hidden"
          accept=".json,application/json"
          tabindex="-1"
        />
        <label for="custom-level-import" class="custom-level-toolbar__btn">Choose JSON…</label>
        <p id="custom-level-import-status" class="custom-level-import-status" role="status" aria-live="polite"></p>
      </div>
    </div>

    <!-- GameBoy -->
    <div class="gameboy" aria-hidden="true">
      <!-- Cartridge -->
      <div class="cartbridge" aria-hidden="true">
        <div class="cartbridge__top"></div>
        <div class="cartbridge__logo-container">
          <div class="cartbridge__top-left">
            <div class="cartbridge__line"></div>
            <div class="cartbridge__line"></div>
            <div class="cartbridge__line"></div>
            <div class="cartbridge__line"></div>
          </div>
          <div class="cartbridge__top-right">
            <div class="cartbridge__line"></div>
            <div class="cartbridge__line"></div>
            <div class="cartbridge__line"></div>
            <div class="cartbridge__line"></div>
          </div>
        </div>
        <div class="cartbridge__sticker-container"></div>
        <div class="cartbridge__left"></div>
        <div class="cartbridge__right"></div>
        <div class="cartbridge__arrow"></div>
      </div>
      <!-- /Cartridge -->
      <div class="side one"></div>
      <div class="side two">
        <div class="deep">◄Off•On►</div>
        <div class="line"></div>
        <div class="line small"></div>
        <div class="line small b"></div>
        <div class="display">
          <div class="line"></div>
          <div class="line t"><span>DOT MATRIX WITH STEREO SOUND</span></div>
          <div class="line d"></div>
          <div class="line e"></div>
          <div class="pwbtn"><span>BATTERY</span></div>
          <div class="innerdisplay">
            <!-- Game Canvas -->
            <canvas id="gameCanvas"></canvas>
            <!-- /Game Canvas -->
          </div>
        </div>
        <div class="gbtext">Nintendo<span>GAME BOY<p>TM</p></span>
        </div>
        <div class="crossa"></div>
        <div class="crossb"></div>
        <div class="select"><span>SELECT</span></div>
        <div class="start"><span>START</span></div>
        <div class="btnb"><span>B</span></div>
        <div class="btna"><span>A</span></div>
        <div class="sline a"></div>
        <div class="sline b"></div>
        <div class="sline c"></div>
        <div class="sline d"></div>
        <div class="sline e"></div>
        <div class="sline f"></div>
        <div class="deep b">PHOMES</div>
      </div>
      <div class="side three">
        <div class="connector"></div>
      </div>
      <div class="side four">
        <div class="powerbtn"></div>
        <div class="line top"></div>
      </div>
      <div class="side five">
        <div class="connector"></div>
        <div class="volume"></div>
      </div>
      <div class="side six">
        <div class="headphones"></div>
      </div>
    </div>
    <!-- /GameBoy -->

    <!-- Touch Controls (Mobile Only) -->
    <div id="touch-controls" class="touch-controls hidden">
      <div class="dpad">
        <button class="touch-btn touch-up" data-direction="up">▲</button>
        <button class="touch-btn touch-down" data-direction="down">▼</button>
        <button class="touch-btn touch-left" data-direction="left">◄</button>
        <button class="touch-btn touch-right" data-direction="right">►</button>
        <div class="dpad-center"></div>
      </div>
      <div class="action-buttons">
        <button class="touch-btn touch-action" data-direction="action">A</button>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
